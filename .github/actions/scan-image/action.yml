name: Scan local image
description: Gate a local image with Trivy and emit a SARIF report.

inputs:
  image-ref:
    description: Local image reference to scan.
    required: true
  target:
    description: Image target used in the SARIF filename.
    required: true
  architecture:
    description: Image architecture used in the SARIF filename.
    required: true

outputs:
  sarif_file:
    description: Path to the generated SARIF report.
    value: ${{ steps.metadata.outputs.sarif_file }}

runs:
  using: composite
  steps:
    - name: Select SARIF path
      id: metadata
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: echo "sarif_file=trivy-${TARGET}-${ARCHITECTURE}.sarif" >> "$GITHUB_OUTPUT"

    # The gate blocks only on what a build can act on: a finding with a fixed version.
    # ignore-unfixed skips affected/fix_deferred/will_not_fix/end_of_life, so a new
    # CVE the distro has not patched yet cannot turn every unrelated PR red. Those
    # findings are not dropped: the SARIF step below keeps ignore-unfixed off and
    # uploads them to code scanning, where they are reviewed.
    - name: Trivy gate
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln,secret
        trivyignores: .trivyignore.yaml
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        format: table
        hide-progress: true

    - name: Create Trivy SARIF
      if: ${{ !cancelled() }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln,secret
        trivyignores: .trivyignore.yaml
        vuln-type: os,library
        severity: HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: "0"
        format: sarif
        output: ${{ steps.metadata.outputs.sarif_file }}
        limit-severities-for-sarif: true
        hide-progress: true
        skip-setup-trivy: true
        cache: false
