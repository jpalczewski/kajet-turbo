  # Caddy 2.11.4 is the latest upstream release, but its binary was compiled
  # before these Go fixes. Scope each exception to that exact binary/package
  # version so a rebuilt Caddy cannot silently inherit it. Review on expiry.
  - id: CVE-2026-46600
    paths: [usr/bin/caddy]
    purls:
      - "pkg:golang/golang.org/x/net@v0.55.0"
      - "pkg:golang/stdlib@v1.26.3"
    expired_at: 2026-09-30
    statement: Awaiting a Caddy release built with patched Go dependencies.
  - id: CVE-2026-56854
    paths: [usr/bin/caddy]
    purls: ["pkg:golang/golang.org/x/crypto@v0.52.0"]
    expired_at: 2026-09-30
    statement: >-
      golang.org/x/crypto/ssh auth-bypass fix, not yet in an upstream Caddy release.
      This ingress image runs Caddy as a reverse proxy / static file server only —
      no SSH server or client functionality is exposed.
  - id: CVE-2026-56852
    paths: [usr/bin/caddy]
    purls: ["pkg:golang/golang.org/x/text@v0.37.0"]
    expired_at: 2026-09-30
